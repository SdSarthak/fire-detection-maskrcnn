# GKE resources for the fire detection API.
# Replace PROJECT_ID before applying, or render with:
#   sed "s/PROJECT_ID/$(gcloud config get-value project)/" mlops/gke/deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fire-detection
  namespace: default
  labels:
    app: fire-detection
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fire-detection
  template:
    metadata:
      labels:
        app: fire-detection
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fire-detection-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Pull the trained checkpoint from Cloud Storage before the API starts.
      # The service account needs Workload Identity with objectViewer on the
      # bucket; see mlops/DEPLOYMENT_GUIDE.md.
      initContainers:
        - name: fetch-model
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command: ['sh', '-c']
          args:
            - |
              set -eu
              echo "Fetching $MODEL_GCS_URI"
              gcloud storage cp "$MODEL_GCS_URI" /models/fire_detection_model.pt
              ls -lh /models/fire_detection_model.pt
          env:
            - name: MODEL_GCS_URI
              valueFrom:
                configMapKeyRef:
                  name: fire-detection-config
                  key: model_gcs_uri
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"

      containers:
        - name: fire-detection
          image: us-central1-docker.pkg.dev/PROJECT_ID/fire-detection/fire-detection:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: MODEL_PATH
              value: "/models/fire_detection_model.pt"
            - name: DEVICE
              value: "cpu"
            - name: SCORE_THRESHOLD
              value: "0.5"
            - name: MAX_CONTENT_LENGTH_MB
              value: "16"
            - name: MAX_BATCH_SIZE
              value: "16"
            # Bounds the DECODED image, which MAX_CONTENT_LENGTH_MB does not.
            - name: MAX_IMAGE_PIXELS
              value: "40000000"
            - name: MODEL_LOAD_RETRY_SECONDS
              value: "30"
            - name: MODEL_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp

          # Loading Mask R-CNN takes a while, so give the container a startup
          # budget of up to 5 minutes before the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30

          # Readiness only passes once the model is actually usable.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: model-storage
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fire-detection-config
  namespace: default
data:
  # Where train.py's checkpoint was uploaded.
  model_gcs_uri: "gs://fire-detection-models/fire_detection_model.pt"

---
apiVersion: v1
kind: Service
metadata:
  name: fire-detection-service
  namespace: default
  labels:
    app: fire-detection
spec:
  type: LoadBalancer
  selector:
    app: fire-detection
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fire-detection-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fire-detection

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fire-detection-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fire-detection
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fire-detection-sa
  namespace: default
