"""
uWSGI configuration for production deployment
"""

# Socket to bind to
socket = "0.0.0.0:5000"

# Master process
master = True

# Number of worker processes
processes = 4

# Threads per worker
threads = 2

# Worker reload timeout
worker_reload_time = 120

# HTTP timeout
http_timeout = 300

# Buffer size
buffer_size = 32768

# Log level
loglevel = "info"

# Log format
log_format = '%(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)"'

# Callable
callable = "app"

# Module
module = "app:app"

# Master process name
procname = "Fire Detection API"

# Auto reload on code changes (disable in production)
auto_reload = False

# Daemonize
daemonize = "/var/log/uwsgi/fire_detection.log"

# PID file
pidfile = "/var/run/uwsgi/fire_detection.pid"

# Virtual environment path (if using)
# virtualenv = "/path/to/venv"
