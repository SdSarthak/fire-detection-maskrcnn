[uwsgi]
; Speak HTTP directly: the Kubernetes probes and the LoadBalancer talk to this
; port, so the uwsgi binary protocol (plain `socket`) would not be understood.
http-socket = 0.0.0.0:5000

; WSGI entrypoint: the `app` object inside app.py
wsgi-file = app.py
callable = app

master = true
procname-master = fire-detection-api

; Torch already parallelises inside a worker, so keep the process count modest
; and let the pod autoscaler add replicas instead. Override with UWSGI_PROCESSES.
processes = 2
threads = 2
enable-threads = true
single-interpreter = true

; Load the app after fork so each worker owns its own model copy.
lazy-apps = true

; Model loading takes a while on cold start; do not kill the worker for it.
harakiri = 300
http-timeout = 300
worker-reload-mercy = 60
buffer-size = 32768

; Log to stdout so Cloud Logging picks the lines up; never daemonize in a container.
die-on-term = true
disable-logging = false
log-4xx = true
log-5xx = true

; Recycle workers periodically to bound memory growth.
max-requests = 500
reload-on-rss = 3000

vacuum = true
