# Cloud Build CI/CD pipeline for the fire detection API.
#
# Trigger this on pushes to main. It builds the container, pushes it to
# Artifact Registry and publishes a Pub/Sub message; the Cloud Run Function in
# mlops/cloud_functions/ consumes that message and rolls the new image out.
#
#   gcloud builds submit --config mlops/cloudbuild/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_ARTIFACT_REPO=fire-detection

steps:
  # 1. Build the image (repository root is the build context).
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE}:latest'
      - '-f'
      - 'mlops/flask_app/Dockerfile'
      - '.'

  # 2. Push both tags.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args: ['push', '${_IMAGE}:${SHORT_SHA}']
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args: ['push', '${_IMAGE}:latest']
    waitFor: ['build-image']

  # 3. Announce the new image so the Cloud Run Function can patch the cluster.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'publish-image-ready'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud pubsub topics publish "${_PUBSUB_TOPIC}" --message "$(cat <<EOF
        {
          "image_uri": "${_IMAGE}:${SHORT_SHA}",
          "build_id": "${BUILD_ID}",
          "commit_sha": "${COMMIT_SHA}",
          "repo_name": "${REPO_NAME}"
        }
        EOF
        )"
    waitFor: ['push-sha']

  # 4. Belt and braces: apply the image directly too, so a deploy still happens
  #    if the Pub/Sub consumer is unavailable. `kubectl set image` is idempotent.
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-deployment'
    args:
      - 'set'
      - 'image'
      - 'deployment/${_DEPLOYMENT}'
      - '${_DEPLOYMENT}=${_IMAGE}:${SHORT_SHA}'
      - '-n'
      - '${_NAMESPACE}'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['publish-image-ready']

  # 5. Block until the rollout is healthy so a failed build fails the pipeline.
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'verify-rollout'
    args:
      - 'rollout'
      - 'status'
      - 'deployment/${_DEPLOYMENT}'
      - '-n'
      - '${_NAMESPACE}'
      - '--timeout=10m'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['update-deployment']

images:
  - '${_IMAGE}:${SHORT_SHA}'
  - '${_IMAGE}:latest'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'fire-detection'
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/fire-detection'
  _GKE_CLUSTER: 'fire-detection-cluster'
  _GKE_ZONE: 'us-central1-a'
  _DEPLOYMENT: 'fire-detection'
  _NAMESPACE: 'default'
  _PUBSUB_TOPIC: 'fire-detection-image-ready'

timeout: 2400s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
